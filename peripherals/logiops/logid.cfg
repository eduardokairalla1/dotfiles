# ============================================================================
# Logitech MX Master 3S Configuration
# ============================================================================
# This configuration customizes the MX Master 3S mouse for optimal workflow
# on Linux systems.
#
# Tested environment:
# - OS: Fedora 43
# - Desktop: GNOME
# - Display server: Wayland
# ============================================================================

devices: (
{
  name: "MX Master 3S";

  # --------------------------------------------------------------------------
  # POINTER SETTINGS
  # --------------------------------------------------------------------------
  
  dpi: 1200;  # Cursor sensitivity (adjust to your preference)

  # -------------------------------------------------------------------------
  # SMARTSHIFT CONFIGURATION
  # -------------------------------------------------------------------------
  # Controls the magnetic scroll wheel resistance
  # Higher threshold = harder to trigger free-spin mode
  
  smartshift: {
    on: true;
    threshold: 80;              # Resistance level (0-255)
    default_threshold: 80;      # Default value on device reset
  };

  # -------------------------------------------------------------------------
  # HI-RES SCROLL FIX
  # -------------------------------------------------------------------------
  # Disables high-resolution scrolling to reduce sensitivity
  # Set hires: true if you prefer smoother, more precise scrolling
  
  hiresscroll: {
    hires: false;    # Disable for less sensitive scrolling
    invert: false;   # Normal scroll direction
    target: false;   # Apply to current window only
  };

  # -------------------------------------------------------------------------
  # THUMBWHEEL (HORIZONTAL SCROLL)
  # -------------------------------------------------------------------------
  # Maps horizontal thumbwheel to browser/editor tab switching
  # Works in: Brave, Firefox, Chrome, VS Code, terminals with tabs
  
  thumbwheel: {
    divert: true;     # Enable custom mapping
    invert: false;    # Normal direction (left = previous, right = next)

    left: {
      mode: "OnInterval";
      interval: 2;    # Trigger every 2 scroll units (adjust for sensitivity)
      action: {
        type: "Keypress";
        keys: ["KEY_LEFTCTRL", "KEY_PAGEUP"];  # Previous tab
      };
    };

    right: {
      mode: "OnInterval";
      interval: 2;    # Trigger every 2 scroll units (adjust for sensitivity)
      action: {
        type: "Keypress";
        keys: ["KEY_LEFTCTRL", "KEY_PAGEDOWN"];  # Next tab
      };
    };
  };

  # -------------------------------------------------------------------------
  # BUTTON MAPPINGS
  # -------------------------------------------------------------------------
  
  buttons: (

    # -----------------------------------------------------------------------
    # SCROLL WHEEL CLICK (Middle Button)
    # -----------------------------------------------------------------------
    # Default behavior: open links in new tab
    
    {
      cid: 0x52;
      action: {
        type: "MouseButton";
        button: 2;  # Middle mouse button
      };
    },

    # -----------------------------------------------------------------------
    # THUMB BUTTON (Gesture Button)
    # -----------------------------------------------------------------------
    # Press + drag in different directions for various actions
    # Press without moving: Open terminal
    # Up/Down: Switch workspaces
    # Left/Right: Alt+Tab between applications
    
    {
      cid: 0xc3;
      action: {
        type: "Gestures";
        gestures: (

          # No movement: Open terminal
          # Note: Super+Enter is custom shortcut to open terminal in
          # GNOME added in Settings > Keyboard Shortcuts
          {
            direction: "None";
            mode: "OnRelease";
            action: {
              type: "Keypress";
              keys: ["KEY_LEFTMETA", "KEY_ENTER"];  # Super+Enter
            };
          },

          # Up: Previous workspace
          {
            direction: "Up";
           threshold: 80;  # Minimum pixels to trigger gesture
            mode: "OnRelease";
            action: {
              type: "Keypress";
              keys: ["KEY_LEFTMETA", "KEY_PAGEUP"];
            };
          },

          # Down: Next workspace
          {
            direction: "Down";
            threshold: 80;
            mode: "OnRelease";
            action: {
              type: "Keypress";
              keys: ["KEY_LEFTMETA", "KEY_PAGEDOWN"];
            };
          },

          # Right: Next application (Alt+Tab)
          {
            direction: "Right";
            threshold: 80;
            mode: "OnRelease";
            action: {
              type: "Keypress";
              keys: ["KEY_LEFTALT", "KEY_TAB"];
            };
          },

          # Left: Previous application (Alt+Shift+Tab)
          {
            direction: "Left";
            threshold: 80;
            mode: "OnRelease";
            action: {
              type: "Keypress";
              keys: ["KEY_LEFTALT", "KEY_LEFTSHIFT", "KEY_TAB"];
            };
          }

        );
      };
    }

    # -----------------------------------------------------------------------
    # SIDE BUTTONS (Back/Forward)
    # -----------------------------------------------------------------------
    # Not mapped - using native browser back/forward functionality
    # These work automatically in browsers, file managers, and VS Code
    # cid: 0x53 (front button) = Browser Forward
    # cid: 0x56 (back button)  = Browser Back

  );
}
);

# ============================================================================
# CONFIGURATION NOTES
# ============================================================================
# - Side buttons (0x53, 0x56) use native BrowserBack/Forward events
# - Adjust 'threshold' values to change gesture sensitivity (50-120 range)
# - Adjust 'interval' in thumbwheel for faster/slower tab switching
# - To apply changes: sudo systemctl restart logid
# - To check logs: sudo journalctl -u logid -f
# ============================================================================
